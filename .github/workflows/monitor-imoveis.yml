name: Monitor Imoveis SBC

on:
  schedule:
    # De hora em hora (minuto 7 para fugir do horário de pico do GitHub)
    - cron: "7 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write   # necessário para salvar o state.json

concurrency:
  group: monitor-imoveis
  cancel-in-progress: false

jobs:
  buscar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py

      - name: Salvar estado (anúncios já vistos)
        run: |
          git config user.name "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || (git commit -m "atualiza estado" && git push)
